openapi: 3.0.3
info:
  title: ORIS API
  version: 1.0.0
  description: |-
    Neoficiální OpenAPI specifikace ORIS API (informační systém Českého svazu orientačních sportů), sestavená podle oficiální dokumentace https://oris.orientacnisporty.cz/API.

    API je ve skutečnosti jediný endpoint `/API/`, kde se volaná metoda určuje query parametrem `method`. Pro přehlednost je zde každá metoda uvedena jako samostatná cesta ve tvaru `/API/?method=<název>` – parametr `method` proto není deklarován samostatně, je součástí cesty. (Query string v klíči cesty je mimo striktní OpenAPI standard, dokumentační nástroje jej však běžně zobrazí správně.)

    **Formát odpovědi:** primárně `json`; podporovány jsou i `xml` a `xml2` (xml2 vrací stejné názvy XML nódů pro opakující se hodnoty).

    Není-li uvedeno jinak, komunikace probíhá GET požadavkem. Metody označené jako POST přijímají parametry ve formě `application/x-www-form-urlencoded`.
externalDocs:
  description: Oficiální dokumentace ORIS API
  url: https://oris.orientacnisporty.cz/API
servers:
- url: https://oris.orientacnisporty.cz
- url: https://oris.ceskyorientak.cz
tags:
- name: Závody a kalendář
  description: Kalendář závodů a detailní informace o závodech.
- name: Přihlášky
  description: Čtení a správa přihlášek závodníků na závody.
- name: Doplňkové služby
  description: Objednávky doplňkových služeb k závodům (ubytování, strava, …).
- name: Výsledky a startovky
  description: Výsledky, rankingové výsledky, startovní listiny a mezičasy.
- name: Kluby
  description: Informace o klubech ČSOS, hostování a přestupy.
- name: Osoby a členství
  description: Osoby, registrace a členství v klubech.
- name: Správa klubu
  description: Administrativní operace vyžadující klubový klíč.
- name: Systém a číselníky
  description: Verze systému, číselníky a definice kategorií.
paths:
  /API/?method=getCSOSClubList:
    get:
      tags:
      - Kluby
      operationId: getCSOSClubList
      summary: Seznam všech klubů v ČSOS
      responses:
        '200':
          description: Úspěšná odpověď ve standardní obálce ORIS API. Chyby jsou signalizovány hodnotou
            pole `Status` (jiná než `OK`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                type: object
                description: Odpověď při `format=xml` nebo `format=xml2` (xml2 vrací stejné názvy XML
                  nódů pro opakující se hodnoty). Struktura odpovídá JSON obálce.
      description: 'Příklad: `https://oris.ceskyorientak.cz/API/?format=xml&method=getCSOSClubList`'
      parameters:
      - $ref: '#/components/parameters/Format'
      - $ref: '#/components/parameters/Callback'
  /API/?method=getClub:
    get:
      tags:
      - Kluby
      operationId: getClub
      summary: Informace o konkrétním klubu
      responses:
        '200':
          description: Úspěšná odpověď ve standardní obálce ORIS API. Chyby jsou signalizovány hodnotou
            pole `Status` (jiná než `OK`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                type: object
                description: Odpověď při `format=xml` nebo `format=xml2` (xml2 vrací stejné názvy XML
                  nódů pro opakující se hodnoty). Struktura odpovídá JSON obálce.
      description: 'Příklad: `https://oris.ceskyorientak.cz/API/?format=json&method=getClub&id=1`'
      parameters:
      - $ref: '#/components/parameters/Format'
      - name: id
        in: query
        required: true
        description: číslo nebo zkratka klubu (viz getCSOSClubList)
        schema:
          type: string
      - name: eventkey
        in: query
        required: false
        description: bezpečnostní klíč závodu pro kluby jednorázových přihlášek
        schema:
          type: string
      - $ref: '#/components/parameters/Callback'
  /API/?method=getEventList:
    get:
      tags:
      - Závody a kalendář
      operationId: getEventList
      summary: Kalendář závodů
      responses:
        '200':
          description: Úspěšná odpověď ve standardní obálce ORIS API. Chyby jsou signalizovány hodnotou
            pole `Status` (jiná než `OK`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                type: object
                description: Odpověď při `format=xml` nebo `format=xml2` (xml2 vrací stejné názvy XML
                  nódů pro opakující se hodnoty). Struktura odpovídá JSON obálce.
      description: |-
        **Pozn.:** Lze použít i getEventListVersions se stejnými parametry (vrací pouze ID a verzi záznamu)

        Příklad: `https://oris.ceskyorientak.cz/API/?format=xml&method=getEventList`
      parameters:
      - $ref: '#/components/parameters/Format'
      - name: all
        in: query
        required: false
        description: pokud je nastaveno all=1 pak zobrazí i ostatní závody mimo oficiální kalendář
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: name
        in: query
        required: false
        description: část názvu závodu
        schema:
          type: string
      - name: sport
        in: query
        required: false
        description: id sportu ... 1=OB, 2=LOB, 3=MTBO, 4=TRAIL (lze zadat více hodnot oddělených čárkou)
        schema:
          type: string
          example: '1'
      - name: rg
        in: query
        required: false
        description: zkratka regionu např. HA, P, MSK, ...
        schema:
          type: string
      - name: level
        in: query
        required: false
        description: id úrovně (lze zadat více hodnot oddělených čárkou)
        schema:
          type: string
      - name: datefrom
        in: query
        required: false
        description: datum od ve formátu RRRR-MM-DD (pokud není zadáno, pak se používá první den aktuálního
          roku)
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: dateto
        in: query
        required: false
        description: datum do ve formátu RRRR-MM-DD (pokud není zadáno, pak se používá poslední den aktuálního
          roku)
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: club
        in: query
        required: false
        description: id pořádajícího klubu
        schema:
          type: integer
      - name: myClubId
        in: query
        required: false
        description: id klubu pro zobrazení počtu přihlášek a výsledků
        schema:
          type: integer
      - $ref: '#/components/parameters/Callback'

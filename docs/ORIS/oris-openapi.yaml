      description: |-
        Přijímá stejné parametry jako getEventList, vrací pouze ID a verzi záznamu. Hodí se pro efektivní zjištění změn v kalendáři.

        Příklad: `https://oris.ceskyorientak.cz/API/?format=json&method=getEventListVersions`
      parameters:
      - $ref: '#/components/parameters/Format'
      - name: all

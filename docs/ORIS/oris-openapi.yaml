  /API/?method=getEventEntries:
    get:
      tags:
      - Přihlášky
      operationId: getEventEntries
      summary: Seznam přihlášek pro daný závod (možno i pro konkrétní kategorii)
      responses:
        '200':
          description: Úspěšná odpověď ve standardní obálce ORIS API. Chyby jsou signalizovány hodnotou

  /API/?method=createPerson:
    post:
      tags:
      - Osoby a členství
      operationId: createPerson
      summary: Vytvoř osobu
      responses:
        '200':
          description: Úspěšná odpověď ve standardní obálce ORIS API. Chyby jsou signalizovány hodnotou
            pole `Status` (jiná než `OK`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                type: object
                description: Odpověď při `format=xml` nebo `format=xml2` (xml2 vrací stejné názvy XML
                  nódů pro opakující se hodnoty). Struktura odpovídá JSON obálce.
      parameters:
      - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                clubkey:
                  type: string
                  description: bezpečnostní klíč klubu ze stránky klubu (přístupné pro vedoucí klubu)
                firstname:
                  type: string
                  description: jméno
                lastname:
                  type: string
                  description: příjmení
                birthday:
                  type: string
                  format: date
                  example: '2026-01-01'
                  description: datum narození ve formátu RRRR-MM-DD
                gender:
                  type: string
                  enum:
                  - M
                  - F
                  description: pohlaví, M = muž, F = žena
                email:
                  type: string
                  description: emailová adresa
                nationality:
                  type: string
                  description: národnost (dvoupísmený kód ISO 3166 https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes,
                    Česko = CZ)
                street:
                  type: string
                  description: ulice a číslo popisné bydliště
                city:
                  type: string
                  description: město bydliště
                zip:
                  type: string
                  description: PSČ bydliště
                country:
                  type: string
                  description: země bydliště (dvoupísmený kód ISO 3166 https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes,
                    Česko = CZ)
                persnum:
                  type: string
                  description: rodné číslo - povinné pouze pro českou národnost (nationality=CZ), ve formatu
                    xxxxxx/xxxx
                phone:
                  type: string
                  description: telefon
                gpslon:
                  type: string
                  description: zeměpisná délka adresy bydliště
                gpslat:
                  type: string
                  description: zeměpisná šířka adresy bydliště
                si:
                  type: integer
                  description: číslo SI čipu 1
                si2:
                  type: integer
                  description: číslo SI čipu 2
                si3:
                  type: integer
                  description: číslo SI čipu 3
                sisport:
                  type: integer
                  description: číslo sportu pro SI čip 1 (0 = vše, 1-4 konkrétní sporty)
                sisport2:
                  type: integer
                  description: číslo sportu pro SI čip 2 (0 = vše, 1-4 konkrétní sporty)
                sisport3:
                  type: integer
                  description: číslo sportu pro SI čip 3 (0 = vše, 1-4 konkrétní sporty) (v původní dokumentaci
                    chybně uvedeno podruhé jako sisport)
                sitype:
                  type: integer
                  description: typ SI čipu 1 (0 = vše, 1 = SI kontaktní, 2 = SI bezkontaktní, 3 = SI bezkon.
                    BS11, 5 = ToePunch)
                sitype2:
                  type: integer
                  description: typ SI čipu 2 (0 = vše, 1 = SI kontaktní, 2 = SI bezkontaktní, 3 = SI bezkon.
                    BS11, 5 = ToePunch)
                sitype3:
                  type: integer
                  description: typ SI čipu 3 (0 = vše, 1 = SI kontaktní, 2 = SI bezkontaktní, 3 = SI bezkon.
                    BS11, 5 = ToePunch)
                iofid:
                  type: integer
                  description: IOF ID
              required:
              - clubkey
              - firstname
              - lastname
              - birthday
              - gender
              - email
              - nationality
              - street
              - city
              - zip
              - country
              - persnum

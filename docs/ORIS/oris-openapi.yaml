          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                type: object
                description: Odpověď při `format=xml` nebo `format=xml2` (xml2 vrací stejné názvy XML
                  nódů pro opakující se hodnoty). Struktura odpovídá JSON obálce.
      description: '**Autorizace:** vyžaduje buď `username` + `password`, nebo `clubkey`.'
      parameters:
      - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: přihlašovací jméno uživatele odesílajícího přihlášku (autorizace – viz
                    popis operace)
                password:
                  type: string
                  description: heslo uživatele odesílajícího přihlášku (autorizace – viz popis operace)
                clubkey:
                  type: string
                  description: bezpečnostní klíč klubu ze stránky klubu (přístupné pro vedoucí klubu)
                    (autorizace – viz popis operace)
                clubuser:
                  type: integer
                  description: id člena klubu
                class:
                  type: integer
                  description: id kategorie
                si:
                  type: integer
                  description: SI čip (není-li parametr použit, tak se použije SI čip z ORISu)
                note:
                  type: string
                  description: poznámka
                clubnote:
                  type: string
                  description: klubová poznámka
                requested_start:
                  type: string
                  description: požadovaný start
                rent_si:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: zapůjčení SI čipu (1=ano)
                iofid:
                  type: integer
                  description: IOF ID závodníka (číslo)
                stageX:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: 'přihláška pro X-tou etapu vícedenních závodů (parametr se používa opakovaně)
                    (kde X je 1..počet etap vícedenního závodu - hodnota 1=přihlásit, 0=nepřihlásit) Zástupný
                    název: skutečné parametry jsou stage1, stage2, … stageN podle počtu etap vícedenního
                    závodu.'
                entrystatus:
                  type: integer
                  description: termín přihlášek, parametr je brán v potaz pouze pokud má uživatel práva
                    editovat závod
              required:
              - clubuser
              - class
              anyOf:
              - required:
                - username
                - password
              - required:
                - clubkey

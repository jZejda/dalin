                description: Odpověď při `format=xml` nebo `format=xml2` (xml2 vrací stejné názvy XML
                  nódů pro opakující se hodnoty). Struktura odpovídá JSON obálce.
      description: |-
        **Volitelná autorizace** pro zobrazení klubové poznámky: `username` + `password`.

        **Pozn.:** Pozn. filtr na klub nelze kombinovat s kategorií

        Příklad: `https://oris.ceskyorientak.cz/API/?format=xml&method=getEventEntries&eventid=2077`
      parameters:
      - $ref: '#/components/parameters/Format'
      - name: eventid
        in: query
        required: true
        description: ORIS id závodu (viz getEventList)
        schema:
          type: integer
      - name: classid
        in: query
        required: false
        description: ORIS id kategorie
        schema:
          type: integer
      - name: classname
        in: query
        required: false
        description: název kategorie
        schema:
          type: string
      - name: clubid
        in: query
        required: false
        description: číslo nebo zkratka klubu (viz getCSOSClubList)
        schema:
          type: string
      - name: entrystop
        in: query
        required: false
        description: termín přihlášek (číslo 1-3)
        schema:
          type: integer
      - name: entrystopout
        in: query
        required: false
        description: mimo termín přihlášek (číslo 1-3)
        schema:
          type: integer
      - name: username
        in: query
        required: false
        description: (autorizace) přihlašovací jméno uživatele
        schema:
          type: string
      - name: password
        in: query
        required: false
        description: (autorizace) heslo uživatele
        schema:
          type: string
      - $ref: '#/components/parameters/Callback'

components:
  parameters:
    Format:
      name: format
      in: query
      required: true
      description: Formát odpovědi. Primární je `json`; `xml` a `xml2` jsou podporovány (xml2 vrací stejné
        názvy XML nódů pro opakující se hodnoty).
      schema:
        type: string
        enum:
        - json
        - xml
        - xml2
        default: json
    Callback:
      name: callback
      in: query
      required: false
      description: Název JSONP callback funkce pro cross-domain volání (pouze pro `format=json`).
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      description: Standardní obálka odpovědi ORIS API (format=json).
      properties:
        Data:
          description: Vlastní data odpovědi – struktura závisí na volané metodě. Opakující se záznamy
            jsou vráceny jako objekt s klíči typu `Event_123`, `Feature_1` apod.
        Format:
          type: string
          example: json
        Status:
          type: string
          example: OK
          description: '`OK` při úspěchu.'
        ExportCreated:
          type: string
          example: '2026-07-03 15:46:31'
          description: Datum a čas vytvoření odpovědi.
        Method:
          type: string
          example: getVersion
          description: Název volané metody.

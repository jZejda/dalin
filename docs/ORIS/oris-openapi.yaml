        required: false
        description: datum do ve formátu RRRR-MM-DD (pokud není zadáno, pak se používá poslední den aktuálního
          roku)
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: club
        in: query
        required: false
        description: id pořádajícího klubu
        schema:
          type: integer
      - name: myClubId
        in: query
        required: false
